<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZF Quality League — Quiz de Treino</title>
<style>
  :root{
    --navy:#0f1c3a;
    --navy2:#16254a;
    --pitch:#0b3d2e;
    --pitch2:#0e4d38;
    --gold:#d4af37;
    --gold-light:#f0d878;
    --chalk:#f4f1e8;
    --line:rgba(244,241,232,0.18);
    --red:#c0392b;
    --green:#2e7d4f;
    --ink:#0f1c3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tahoma','Segoe UI',Verdana,sans-serif;
    background:
      radial-gradient(circle at 20% -10%, rgba(212,175,55,0.10), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(212,175,55,0.06), transparent 40%),
      linear-gradient(180deg, var(--navy) 0%, #0a1530 100%);
    color:var(--chalk);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{width:100%;max-width:720px;}

  /* Scoreboard header */
  .board{
    background:linear-gradient(180deg, var(--navy2), var(--navy));
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .board::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg, transparent 0 38px, rgba(255,255,255,0.02) 38px 40px);
    pointer-events:none;
  }
  .kicker{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold-light); font-weight:700; opacity:.9;
  }
  h1{
    font-family:Georgia,'Times New Roman',serif;
    font-size:28px; margin:4px 0 14px; letter-spacing:.01em;
    color:var(--chalk);
  }
  h1 span{color:var(--gold-light);}

  .scoreline{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .pill{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    font-size:13px;
  }
  .pill b{color:var(--gold-light); font-variant-numeric:tabular-nums;}
  .ball{width:9px;height:9px;border-radius:50%;background:var(--gold-light);display:inline-block;}

  .progress-track{
    margin-top:16px;
    height:8px; border-radius:999px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--pitch2), var(--gold));
    width:0%;
    transition:width .35s ease;
  }

  /* Question card */
  .card{
    background:var(--chalk);
    color:var(--ink);
    border-radius:14px;
    padding:26px 24px 22px;
    box-shadow:0 14px 34px rgba(0,0,0,0.4);
    border:1px solid rgba(0,0,0,0.06);
  }
  .qmeta{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px;
  }
  .qnum{
    font-family:Georgia,serif; font-weight:700; font-size:13px;
    color:var(--pitch2); letter-spacing:.05em; text-transform:uppercase;
  }
  .qtag{
    font-size:11px; color:#8a8470; letter-spacing:.05em;
  }
  .qtext{
    font-size:19px; line-height:1.45; font-weight:600;
    margin:6px 0 20px;
    font-family:Georgia,'Times New Roman',serif;
  }

  .opt{
    display:flex; align-items:flex-start; gap:12px;
    width:100%; text-align:left;
    background:#fff;
    border:1.5px solid #e2ddc9;
    border-radius:10px;
    padding:13px 16px;
    margin-bottom:10px;
    cursor:pointer;
    font-size:15px; line-height:1.4;
    color:var(--ink);
    transition:border-color .15s ease, transform .1s ease, background .15s ease;
    font-family:inherit;
  }
  .opt:hover:not(.locked){
    border-color:var(--pitch2);
    transform:translateX(2px);
  }
  .opt .letter{
    flex:0 0 auto;
    width:26px;height:26px;border-radius:50%;
    background:var(--navy);
    color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;
    font-weight:700; font-size:12.5px;
    font-family:Georgia,serif;
  }
  .opt.correct{
    border-color:var(--green);
    background:#eaf6ee;
  }
  .opt.correct .letter{background:var(--green); color:#fff;}
  .opt.wrong{
    border-color:var(--red);
    background:#fbeceb;
  }
  .opt.wrong .letter{background:var(--red); color:#fff;}
  .opt.locked{cursor:default;}
  .opt.dim{opacity:.55;}

  .feedback{
    margin-top:6px; margin-bottom:6px;
    min-height:26px;
    font-size:14px; font-weight:700;
    display:flex; align-items:center; gap:8px;
  }
  .feedback.ok{color:var(--green);}
  .feedback.bad{color:var(--red);}

  .controls{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:18px; gap:10px; flex-wrap:wrap;
  }
  .btn{
    border:none; border-radius:9px; padding:11px 20px;
    font-size:14px; font-weight:700; cursor:pointer;
    font-family:inherit;
    letter-spacing:.02em;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:var(--navy); color:var(--gold-light);
  }
  .btn-primary:disabled{opacity:.35; cursor:not-allowed;}
  .btn-ghost{
    background:transparent; color:#7a7460;
    border:1px solid #d9d3bd;
  }

  /* End screen */
  .final{
    text-align:center; padding:20px 10px 6px;
  }
  .final .score-big{
    font-family:Georgia,serif; font-size:56px; font-weight:700;
    color:var(--navy); line-height:1;
  }
  .final .score-sub{color:#7a7460; margin-top:6px; font-size:14px;}
  .medal{font-size:44px; margin-bottom:6px;}
  .final-msg{
    margin:18px 0; font-size:15px; color:#3a3626; line-height:1.5;
  }
  .review-list{
    text-align:left; margin-top:22px; border-top:1px solid #e2ddc9; padding-top:16px;
  }
  .review-item{
    padding:10px 0; border-bottom:1px dashed #e2ddc9; font-size:13.5px;
  }
  .review-item .rq{font-weight:700; margin-bottom:4px;}
  .review-item .ra{color:var(--green);}
  .review-item .rw{color:var(--red); text-decoration:line-through; opacity:.8;}

  footer{
    text-align:center; margin-top:22px; font-size:11.5px; color:rgba(244,241,232,0.4);
    letter-spacing:.03em;
  }

  @media (max-width:480px){
    h1{font-size:22px;}
    .qtext{font-size:17px;}
    .score-big{font-size:44px !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="board">
    <div class="kicker">Cartilha de Qualidade — Treino</div>
    <h1>ZF <span>Quality League</span> 2026</h1>
    <div class="scoreline">
      <div class="pill"><span class="ball"></span> Pergunta <b id="cur">1</b> / <b id="tot">100</b></div>

  <div class="card" id="card"></div>

  <footer>Baseado na cartilha oficial ZF Quality League 2026 — modo de treino individual</footer>
</div>

<script>
const QUESTIONS = [{"q": "Conforme (Controle dos Dispositivos de Medição). Nos equipamentos de medição em que não é possível a colocação de etiquetas ou gravação física, devido ao seu tamanho, é anexada:", "opts": ["Uma etiqueta com vencimento do meio de medição.", "Uma etiqueta no meio de medição com seu respectivo número ZF, número de série e vencimento da calibração.", "Uma tabela ou etiqueta próxima ao meio de medição com seu respectivo número ZF, número de série e vencimento da calibração.", "Uma tabela com etiqueta de vencimento para o meio de medição que não é calibrado."], "correct": 2}, {"q": "Caso o instrumento de medição apresente mau funcionamento ou esteja com a calibração vencida, o que devo fazer?", "opts": ["Aviso o responsável da área e sigo a produção/montagem normalmente.", "Solicito abertura de ordem de serviço.", "Terminar a produção atual e levar o instrumento para calibração.", "Acionar o Plano de Reação."], "correct": 3}, {"q": "Para que serve a a Liberação de linha?", "opts": ["Para conferir se o processo produtivo está conforme o padrão estabelecido.", "Para assegurar que vamos produzir apenas peças boas para o cliente.", "Para testar os conhecimentos dos operadores em relação a folha de métodos.", "A e B estão corretas."], "correct": 3}, {"q": "Qual é o papel da Qualidade no desenvolvimento de um novo produto?", "opts": ["Dar ideias de como tornar o processo de desenvolvimento mais rápido para antecipar a entrega do projeto para o cliente;", "Elaborar os documentos técnicos da peça que está sendo desenvolvida, como os desenhos da peça, especificações aplicáveis, testes necessários entre outros;", "Acompanhar o andamento de todas as etapas do desenvolvimento de um novo produto, garantindo que sejam cumpridas todas exigências do mercado automotivo, do cliente e da ZF;", "A Qualidade não faz parte do time de projetos, portanto não tem papel estabelecido nessa atividade."], "correct": 2}, {"q": "De acordo com a Política da Qualidade ZF, quais m 5 princípios. O princípio PDCA pode ser definido como:", "opts": ["Assegurar o lançamento robusto de produto e um ciclo de vida estável.", "Analisar os dados e informações para melhorar a tomada de decisão.", "Ter uma governança para gerir o conhecimento que produzimos quando resolvemos problemas, evitando a repetição.", "Atuar no desenvolvimento dos colaboradores com foco em competência e cultura da qualidade."], "correct": 2}, {"q": "Qual o objetivo do ZF DNA da Qualidade?", "opts": ["Assegurar o lançamento robusto de produto e um ciclo de vida estável.", "Analisar os dados e informações para melhorar a tomada de decisão.", "Entender as expectativas dos clientes internos e externos.", "Promover a Cultura da Qualidade e a busca do Zero Defeito."], "correct": 3}, {"q": "Ao priorizar a Qualidade, como contribuímos para a organização?", "opts": ["Aumentamos o volume de produção e reduzimos os indicadores logísticos.", "Aumentamos a satisfação dos clientes e reduzimos custos de não-qualidade.", "Diminuímos a quantidade de acidentes na fábrica.", "Aumentamos a vida útil das máquinas e ferramentais."], "correct": 1}, {"q": "No contexto da ZF, a qualidade é ainda mais fundamental porque:", "opts": ["Somos uma empresa global", "Lidamos com produtos de segurança", "Somos conhecidos no mercado", "Precisamos manter o padrão da concorrência"], "correct": 1}, {"q": "Onde está disponível o Plano de Reação?", "opts": ["O Plano de Reação está disponível no verso das folhas de métodos.", "O Plano de Reação está disponível no verso das folhas de apontamentos de produção.", "O Plano de Reação está disponível nas cartas de liberação de linhas, verso das cartas de registro e junto com o diário de bordo.", "Todas estão incorretas."], "correct": 2}, {"q": "Quais são as ações principais do Plano de Reação?", "opts": ["Chamar, Parar e Esperar", "Parar, Esperar e Chamar", "Esperar, Parar e Chamar", "Parar, Chamar e Esperar"], "correct": 3}, {"q": "As definições de tipos de meios de medição, frequência e sequência de operações é realizada pela:", "opts": ["Engenharia de Produto.", "Engenharia de Processos.", "Time multifuncional.", "Coordenadores de Produção."], "correct": 1}, {"q": "Quando o instrumento de medição definido no Plano de Controle está em calibração, devemos:", "opts": ["Continuar a produção e realizar a medição no retorno do instrumento.", "Solicitar emprestado da outra área.", "Interromper o processo e comunicar as áreas suportes (Coordenação e/ou Processos e/ou Qualidade).", "Abrir ordem de serviço."], "correct": 2}, {"q": "Para que serve o Plano de Reação?", "opts": ["Serve para auxiliar na detecção de um problema e suspeita de quebra da qualidade do produto.", "Serve para auxiliar na liberação de Poka yokes.", "Serve para auxiliar na liberação de linha sem risco de quebra da qualidade.", "Todas estão corretas."], "correct": 0}, {"q": "PPAP é o nome dado a um conjunto de documentos gerados durante a fase de desenvolvimento de uma nova peça e é comumente exigido pelos clientes no final do desenvolvimento para aprovação do produto e de todo o processo produtivo dessa peça. Na ZF o acompanhamento de todo o processo de PPAP, preparação do pacote de documentos e envio ao cliente é realizada pela área de:", "opts": ["Vendas;", "Engenharia de Processo;", "Engenharia de Produto;", "Qualidade de Projetos;"], "correct": 3}, {"q": "Quais as principais informações que uma identificação de material deve possuir?", "opts": ["Número da peça, quantidade e cor.", "Quantidade, número da peça e nome da peça.", "Número da peça, material da peça e processo onde a peça foi fabricada.", "Quantidade, nome da peça e nome do profissional que produziu a peça."], "correct": 1}, {"q": "O membro da Qualidade que participa do time de desenvolvimento do projeto tem um poder especial e tem autoridade para exercer tal poder quando julgar que o projeto não cumpre com as exigências estabelecidas. Qual é esse poder especial conferido ao time de Qualidade de Projetos?", const LETTERS = ['A','B','C','D'];

let order = [];       // shuffled question indices
let idx = 0;           // position in order[]
let score = 0;
let answered = 0;
let locked = false;
let wrongLog = [];

const card = document.getElementById('card');
const curEl = document.getElementById('cur');
const totEl = document.getElementById('tot');
const scoreEl = document.getElementById('score');
const accEl = document.getElementById('acc');
const progressEl = document.getElementById('progress');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startGame(){
  order = shuffle(QUESTIONS.map((_,i)=>i));
  idx = 0; score = 0; answered = 0; locked = false; wrongLog = [];
  totEl.textContent = order.length;
  scoreEl.textContent = '0';
  accEl.textContent = '—';
  renderQuestion();
}

function renderQuestion(){

  const qi = order[idx];
  const q = QUESTIONS[qi];

  html += '<div id="opts">';
  optIdx.forEach((origI, pos)=>{
    html += '<button class="opt" data-orig="'+origI+'">'+
      '<span class="letter">'+LETTERS[pos]+'</span>'+
      '<span>'+escapeHtml(q.opts[origI])+'</span></button>';
  });
  html += '</div>';
  html += '<div class="feedback" id="fb"></div>';
  html += '<div class="controls">'+
      '<button class="btn btn-ghost" id="skip">Pular</button>'+
      '<button class="btn btn-primary" id="next" disabled>Próxima pergunta →</button>'+
    '</div>';

  card.innerHTML = html;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(btn, q));
  });
  document.getElementById('next').addEventListener('click', goNext);
  document.getElementById('skip').addEventListener('click', ()=>{
    if(locked) return;
    goNext();
  });
}

function selectAnswer(btn, q){
  if(locked) return;
  locked = true;
  answered++;

  const chosen = parseInt(btn.dataset.orig,10);
  const isCorrect = chosen === q.correct;
  if(isCorrect) score++;

  document.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('locked');
    const oi = parseInt(o.dataset.orig,10);
    if(oi === q.correct){
      o.classList.add('correct');
    } else if(o === btn){
      o.classList.add('wrong');
    } else {
      o.classList.add('dim');
    }
  });

  const fb = document.getElementById('fb');
  if(isCorrect){
    fb.className = 'feedback ok';
    fb.textContent = '⚽ Gol! Resposta correta.';
  } else {
    fb.className = 'feedback bad';
    fb.textContent = '✖ Errou — a certa é: ' + q.opts[q.correct];
    wrongLog.push({q: q.q, your: q.opts[chosen], right: q.opts[q.correct]});
  }

  scoreEl.textContent = score;
  accEl.textContent = Math.round(score/answered*100)+'%';
  document.getElementById('next').disabled = false;
}

function goNext(){
  idx++;
  if(idx >= order.length){
    renderFinal();
  } else {
    renderQuestion();
  }
}

function renderFinal(){
  progressEl.style.width = '100%';
  curEl.textContent = order.length;
  const pct = Math.round(score/order.length*100);
  let medal = '🥉', msg = 'Dá pra melhorar — revisa a cartilha e tenta de novo!';
  if(pct >= 90){ medal='🏆'; msg='Show de bola! Você está pronto pra ir bem na rodada.'; }
  else if(pct >= 70){ medal='🥈'; msg='Muito bom! Só reforçar os pontos que errou.'; }
  else if(pct >= 50){ medal='🥉'; msg='Bom começo — repassa as perguntas erradas abaixo.'; }

  let html = '<div class="final">';
  html += '<div class="medal">'+medal+'</div>';
  html += '<div class="score-big">'+score+'/'+order.length+'</div>';
  html += '<div class="score-sub">'+pct+'% de aproveitamento</div>';
  html += '<div class="final-msg">'+msg+'</div>';
  html += '<div class="controls" style="justify-content:center;">'+
    '<button class="btn btn-primary" id="restart">Jogar de novo (embaralhado)</button></div>';

  if(wrongLog.length){
    html += '<div class="review-list"><div class="qnum" style="margin-bottom:8px;display:block;">Revisão — perguntas que você errou ('+wrongLog.length+')</div>';
    wrongLog.forEach(w=>{
      html += '<div class="review-item">'+
        '<div class="rq">'+escapeHtml(w.q)+'</div>'+
        '<div class="rw">Você marcou: '+escapeHtml(w.your)+'</div>'+
        '<div class="ra">Certa: '+escapeHtml(w.right)+'</div>'+
      '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  card.innerHTML = html;
  document.getElementById('restart').addEventListener('click', startGame);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

startGame();
</script>
</body>
</html>
